<div class="author">
  <a href="/">
    <img
      class="author-avatar"
      src="{{ site.author.avatar }}"
      alt="{{ site.author.username }}"
    />
  </a>
  <h2 class="author-name"><a href="/">{{ site.author.name }}</a></h2>
  
  {%- if page.layout == 'home' -%}
    <h3 class="hero-subtitle">
      I am a <span class="typing-text" id="typing-element">Software Engineer</span>
    </h3>
    <p class="author-bio">{{ site.author.bio }}</p>
    
    <!-- Minimalist Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-number">4+</span>
        <span class="stat-label">Publications</span>
      </div>
      <div class="stat-card">
        <span class="stat-number">5+</span>
        <span class="stat-label">Key Projects</span>
      </div>
      <div class="stat-card">
        <span class="stat-number">3+</span>
        <span class="stat-label">SDE Roles</span>
      </div>
    </div>

    <div class="hero-ctas">
      <a href="/projects/" class="btn btn-primary">Explore Projects</a>
      <a href="/experience/" class="btn btn-secondary">My Journey</a>
    </div>
  {%- else -%}
    <p class="author-subtitle">Software Engineer</p>
  {%- endif -%}
</div>
