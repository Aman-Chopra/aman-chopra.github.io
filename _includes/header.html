<head prefix="og: http://ogp.me/ns#">
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="{{ site.title }}" />
  <meta name="apple-mobile-web-app-status-bar-style" content="#fff" />
  <meta name="apple-mobile-web-app-title" content="{{ site.title }}" />
  <title>
    {% if page.title %}{{ page.title | escape }} - {{ site.title }}{% else %}{{
    site.title | escape }}{% endif %}
  </title>
  <link
    rel="alternate"
    href="{{
      page.url | remove: 'index.html' | remove: '.html' | absolute_url
    }}"
    hreflang="{{ site.lang }}"
  />
  <link
    rel="canonical"
    href="{{
      page.url  | remove: 'index.html' | remove: '.html' | absolute_url
    }}"
  />
  {% if paginator.previous_page %}
  <link
    rel="prev"
    href="{{
      paginator.previous_page_path
        | remove: 'index.html'
        | remove: '.html'
    }}"
  />
  {% endif %} {% if paginator.next_page %}
  <link
    rel="next"
    href="{{
      paginator.next_page_path
        | remove: 'index.html'
        | remove: '.html'
    }}"
  />
  {% endif %}
  <meta
    name="description"
    content="{{
      page.description
        | default: site.description
        | strip_html
        | normalize_whitespace
        | truncate: 200
        | escape
    }}"
  />
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <meta property="fb:app_id" content="{{ site.fb_appid }}" />
  <meta
    property="og:site_name"
    content="{% if page.title %}{{ page.title | escape }} | {{
      site.author.name
    }}{% else %}{{ site.title | escape }}{% endif %}"
  />
  <meta
    property="og:title"
    content="{% if page.title %}{{ page.title | escape }} | {{
      site.author.name
    }}{% else %}{{ site.title | escape }}{% endif %}"
  />
  {% if page.location %}
  <meta property="og:type" content="article" />
  <meta
    property="article:publisher"
    content="https://web.facebook.com/{{ site.author.facebook }}"
  />
  {% else %}
  <meta property="og:type" content="website" />
  {% endif %}
  <meta
    property="og:url"
    content="{{
      page.url | remove: 'index.html' | remove: '.html' | absolute_url
    }}"
  />
  <meta
    property="og:description"
    content="{{
      page.description
        | default: site.description
        | strip_html
        | normalize_whitespace
        | truncate: 200
        | escape
    }}"
  />
  {% if page.image %}
  <meta property="og:image" content="{{ page.image | absolute_url }}" />
  {% else %}
  <meta property="og:image" content="{{ site.image | absolute_url }}" />
  {% endif %}
  <meta property="og:image:width" content="640" />
  <meta property="og:image:height" content="640" />
  <meta name="twitter:card" content="summary" />
  <meta
    name="twitter:title"
    content="{% if page.title %}{{ page.title | escape }} | {{
      site.author.twitter
    }}{% else %}{{ site.title | escape }}{% endif %}"
  />
  <meta
    name="twitter:url"
    content="{{
      page.url  | remove: 'index.html' | remove: '.html' | absolute_url
    }}"
  />
  <meta name="twitter:site" content="@{{ site.author.twitter }}" />
  <meta name="twitter:creator" content="@{{ site.author.twitter }}" />
  <meta
    name="twitter:description"
    content="{{
      page.description
        | default: site.description
        | strip_html
        | normalize_whitespace
        | truncate: 200
        | escape
    }}"
  />
  {% if page.image %}
  <meta name="twitter:image" content="{{ page.image | absolute_url }}" />
  {% else %}
  <meta name="twitter:image" content="{{ site.image | absolute_url }}" />
  {% endif %} {% feed_meta %}
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/assets/favicons/apple-touch-icon.png"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/assets/favicons/favicon-32x32.png"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/assets/favicons/favicon-16x16.png"
  />
  <link rel="manifest" href="/assets/favicons/site.webmanifest" />
  <link
    rel="mask-icon"
    href="/assets/favicons/safari-pinned-tab.svg"
    color="#5bbad5"
  />
  <meta name="apple-mobile-web-app-title" content="Jekyll Klise" />
  <meta name="application-name" content="Jekyll Klise" />
  <meta name="msapplication-TileColor" content="#da532c" />
  <meta name="theme-color" content="#2c2c2c" />

  <!-- Premium Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  {%- if page.mermaid -%}
    <!-- Selective Mermaid.js load -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
      (function() {
        const initMermaid = () => {
          try {
            const codeBlocks = document.querySelectorAll("pre > code.language-mermaid");
            const fallbackBlocks = document.querySelectorAll("code.language-mermaid, .language-mermaid code");
            const allBlocks = new Set([...codeBlocks, ...fallbackBlocks]);

            const diagDiv = document.createElement("div");
            diagDiv.style.background = "#1a1a1a";
            diagDiv.style.color = "#00ff00";
            diagDiv.style.border = "2px solid #00ff00";
            diagDiv.style.padding = "12px";
            diagDiv.style.margin = "15px";
            diagDiv.style.borderRadius = "6px";
            diagDiv.style.fontFamily = "monospace";
            diagDiv.style.fontSize = "13px";
            diagDiv.style.lineHeight = "1.5";
            diagDiv.id = "mermaid-diagnostic";
            
            diagDiv.innerHTML = `
              <strong>⚙️ [Mermaid Diagnostic Log]</strong><br>
              • Page Ready State: <code>${document.readyState}</code><br>
              • <code>pre &gt; code.language-mermaid</code> matches: <code>${codeBlocks.length}</code><br>
              • Fallback matches: <code>${fallbackBlocks.length}</code><br>
              • Total unique nodes: <code>${allBlocks.size}</code><br>
              • Global <code>mermaid</code> defined: <code>${typeof mermaid !== 'undefined'}</code>
            `;
            const container = document.body;
            container.insertBefore(diagDiv, container.firstChild);

            allBlocks.forEach(codeEl => {
              const preEl = codeEl.closest("pre") || codeEl.parentElement;
              if (!preEl) return;
              
              const mermaidDiv = document.createElement("div");
              mermaidDiv.className = "mermaid";
              mermaidDiv.textContent = codeEl.textContent;
              
              preEl.parentNode.insertBefore(mermaidDiv, preEl);
              preEl.parentNode.removeChild(preEl);
            });

            const isDark = document.body.getAttribute("data-theme") === "dark";
            mermaid.initialize({
              theme: isDark ? "dark" : "default",
              securityLevel: "loose",
              startOnLoad: false,
              themeVariables: {
                fontFamily: "Outfit, sans-serif"
              }
            });

            const nodes = document.querySelectorAll(".mermaid");
            if (nodes.length > 0) {
              if (typeof mermaid.run === "function") {
                mermaid.run({ nodes: nodes });
              } else if (typeof mermaid.init === "function") {
                mermaid.init(undefined, nodes);
              } else if (typeof mermaid.contentLoaded === "function") {
                mermaid.contentLoaded();
              }
            }
          } catch (e) {
            console.error("Mermaid initialization error:", e);
            const errDiv = document.createElement("div");
            errDiv.style.color = "#ff5555";
            errDiv.style.background = "#111111";
            errDiv.style.border = "2px solid #ff5555";
            errDiv.style.padding = "15px";
            errDiv.style.margin = "20px 0";
            errDiv.style.borderRadius = "8px";
            errDiv.style.fontFamily = "monospace";
            errDiv.style.whiteSpace = "pre-wrap";
            errDiv.textContent = "⚠️ Mermaid Init Error: " + e.message + "\n\nStack:\n" + e.stack;
            
            const container = document.querySelector(".page-content") || document.body;
            container.insertBefore(errDiv, container.firstChild);
          }
        };

        document.addEventListener("DOMContentLoaded", initMermaid);
      })();
    </script>
  {%- endif -%}

  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
