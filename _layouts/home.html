---
layout: default
home: true
---



<div class="featured-section">
  <h3 class="featured-heading">Highlighted Work</h3>
  <div class="featured-grid">
    {%- for post in site.categories.projects limit: 3 -%}
      <a href="{{ post.url }}" class="featured-card">
        <div class="card-content">
          <span class="card-date">{{ post.date | date: "%b %d, %Y" }}</span>
          <h4 class="card-title">{{ post.title | escape }}</h4>
          <div class="card-tags">
            {%- for tag in post.tags limit: 4 -%}
              <span class="tag-badge">#{{ tag }}</span>
            {%- endfor -%}
          </div>
        </div>
        <div class="card-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </div>
      </a>
    {%- endfor -%}
  </div>
</div>

{{ content }}
